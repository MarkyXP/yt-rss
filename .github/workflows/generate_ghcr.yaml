name: Docker Image CI for GHCR
on: 
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
  
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      - name: Build and push the image
        run : |
          docker login --username markyxp --password ${{ secrets.GH_PAT }} ghcr.io
          docker build . --tag ghcr.io/markyxp/yt-rss:latest
          docker push          ghcr.io/markyxp/yt-rss:latest