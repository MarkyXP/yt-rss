[project]
name = "ytrss"
version = ""
description = "Uses a LLM to summarise YouTube transcripts, and generates an RSS feed"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
    "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=8.0.1",
]
